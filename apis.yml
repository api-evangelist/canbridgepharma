aid: canbridgepharma
name: CANbridge Pharmaceuticals
description: >-
  CANbridge Pharmaceuticals (CANbridge Life Sciences Ltd.) is a global,
  China-based biopharmaceutical company founded in 2012 that focuses on the
  research, development, and commercialization of transformative therapies for
  rare diseases and rare oncology. The company in-licenses and develops
  differentiated drug candidates from around the world for the Chinese and
  global markets, with a portfolio of approved products and a gene-therapy and
  enzyme-replacement pipeline. Headquartered in Beijing with offices in
  Shanghai, Hong Kong, Taiwan, Suzhou, and Burlington, Massachusetts (USA),
  CANbridge is listed on the Hong Kong Stock Exchange. This profile was added to
  the API Evangelist network as a portfolio company of the venture firm Qiming;
  CANbridge publishes no public developer API, SDK, or machine-readable API
  surface at this time.
